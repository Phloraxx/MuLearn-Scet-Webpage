server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  default_type application/octet-stream;
  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/manifest+json webmanifest;
    application/xml xml;
    text/plain txt;
    image/webp webp;
    image/png png;
    image/jpeg jpg jpeg;
    image/x-icon ico;
    video/mp4 mp4;
    video/webm webm;
  }

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' mailto:; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

  error_page 404 /404.html;
  location = /404.html { internal; }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  location ~* \.(?:js|css|webp|png|jpg|jpeg|ico|mp4|webm)$ {
    try_files $uri =404;
    expires 1y;
  }

  location = /site.webmanifest { expires 1h; }
  location = /sitemap.xml { expires 1h; }
  location = /robots.txt { expires 1h; }
}
